name: Build Railway Wallet ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-setuptools python-is-python3 libsecret-1-dev libx11-dev libxkbfile-dev libkrb5-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack and Yarn
        run: |
          corepack enable
          cd desktop
          corepack prepare yarn@4.5.1 --activate

      - name: Skip optional native addons
        working-directory: ./desktop
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependenciesMeta = {
              ...pkg.dependenciesMeta,
              "bufferutil": { "built": false },
              "utf-8-validate": { "built": false }
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Install dependencies
        working-directory: ./desktop
        env:
          SKIP_POSTINSTALL: "1"
        run: yarn install --no-immutable

      - name: Build Electron app for ARM64
        working-directory: ./desktop
        env:
          CI: "false"
          DISABLE_ESLINT_PLUGIN: "true"
          ESLINT_NO_DEV_ERRORS: "true"
        run: |
          npx patch-package || true
          export REACT_APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VER=$REACT_APP_VERSION" >> $GITHUB_ENV
          yarn run build-electron
          npx electron-builder --linux --arm64 --dir -c.npmRebuild=false

      - name: Pack unpacked app
        working-directory: ./desktop/dist
        run: tar -czf railway-arm64.tar.gz linux-arm64-unpacked

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-arm64 --yes || true
          git push --delete origin latest-arm64 || true
          gh release create latest-arm64 ./desktop/dist/railway-arm64.tar.gz \
            --title "Railway Wallet ARM64 ($APP_VER)" \
            --notes "Сборка версии $APP_VER для Linux ARM64"
